<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ECharts 測試 - 中華民國能源效率管理系統</title>

  <style>
    :root{
      --brand-blue: #0B6E86;
      --text: #4b4b4b;
      --card-radius: 28px;
    }

    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:#f3f6f9;
      font-family: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    .chart-card{
      width: 760px;
      height: 700px;
      background:#fff;
      border-radius: var(--card-radius);
      box-shadow:
        0 28px 70px rgba(0,0,0,.18),
        0 8px 20px rgba(0,0,0,.10);
      position:relative;
      overflow:hidden;
    }

    .chart-title-pill{
      position:absolute;
      top: 34px;
      left:50%;
      transform:translateX(-50%);
      background: var(--brand-blue);
      color:#fff;
      padding: 14px 34px;
      border-radius: 999px;
      font-weight: 700;
      letter-spacing: .5px;
      font-size: 18px;
      line-height: 1;
      box-shadow: 0 10px 24px rgba(11,110,134,.25);
      z-index: 2;
      white-space: nowrap;
    }

    .chart-wrap{
      position:absolute;
      inset: 0;
      padding: 110px 60px 60px 60px;
    }

    #pieChart { 
      width: 100%; 
      height: 100%; 
    }

    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      background: var(--brand-blue);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .back-btn:hover {
      background: #094d5f;
    }
  </style>
</head>

<body>
  <div class="chart-card">
    <a href="index.html" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i>
      返回首頁
    </a>
    <div class="chart-title-pill">節能產品市佔率 - ECharts 測試</div>
    <div class="chart-wrap">
      <div id="pieChart"></div>
    </div>
  </div>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />

  <!-- ECharts -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>

  <script>
    console.log('ECharts loaded:', typeof echarts);
    
    document.addEventListener('DOMContentLoaded', function() {
      console.log('DOM loaded');
      
      if (typeof echarts !== 'undefined') {
        const chart = echarts.init(document.getElementById('pieChart'));
        
        const option = {
          tooltip: {
            trigger: 'item',
            formatter: '{b}: {c}款 ({d}%)'
          },
          series: [{
            name: '節能產品市佔率',
            type: 'pie',
            radius: ['0%', '70%'],
            center: ['50%', '50%'],
            data: [
              {value: 450, name: '冷氣機'},
              {value: 320, name: '冰箱'},
              {value: 180, name: '洗衣機'},
              {value: 150, name: '其他'}
            ],
            itemStyle: {
              borderRadius: 2,
              borderColor: '#fff',
              borderWidth: 2
            },
            label: {
              show: true,
              position: 'outside',
              formatter: '{b}\n{c}款\n{d}%',
              fontSize: 12,
              color: '#4b4b4b'
            },
            labelLine: {
              show: true,
              length: 15,
              length2: 20,
              lineStyle: {
                color: '#0B6E86',
                width: 1.5
              }
            },
            color: ['#1a5aa0', '#4285F4', '#80b1fb', '#d0e0fc'],
            emphasis: {
              itemStyle: {
                shadowBlur: 10,
                shadowOffsetX: 0,
                shadowColor: 'rgba(0, 0, 0, 0.5)'
              }
            }
          }]
        };
        
        chart.setOption(option);
        console.log('Chart initialized successfully');
        
        // 響應式
        window.addEventListener('resize', function() {
          chart.resize();
        });
        
      } else {
        console.error('ECharts not loaded');
      }
    });
  </script>
</body>
</html>
